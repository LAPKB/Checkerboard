[package]
name = "checkmate-desktop"
version = "0.8.0"
description = "Desktop interface for drug-interaction analysis and regimen ranking"
authors = ["Michael Neely"]
edition = "2024"

[workspace]
members = [".", "crates/checkerboard-core"]
resolver = "2"

[features]
# Pilot builds can embed public lease-verification material; absent or invalid
# trust configuration leaves the native session locked.
local-staging = []

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "checkmate_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["time"] }
checkerboard-core = { path = "crates/checkerboard-core" }
pmcore = "0.27.1"
faer = "0.24"
rand = "0.9"
rand_distr = "0.5"
rayon = "1"
calamine = "0.36"
anyhow = "1"
csv = "1"
flate2 = "1"
rust_xlsxwriter = "0.96"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
lapkb-desktop-session = { git = "ssh://git@github.com/LAPKB/Launcher.git", rev = "daba4ce5add38c9147f185e9caec6defa65a22a6", features = ["client"] }

[dev-dependencies]
ed25519-dalek = "2.1.1"
lapkb-authorization-protocol = { git = "ssh://git@github.com/LAPKB/desktop-authorization.git", rev = "bcca349d7ea3d448c85a177fed3b1af4d3f941a1" }
tauri = { version = "2", features = ["test"] }

[patch.crates-io]
pharmsol = { path = "../../vendor/pharmsol" }

# Tauri development builds exercise the numerical optimizer interactively.
# A small amount of optimization keeps NPAG latency representative of the
# packaged application. Incremental compilation is disabled because the
# optimized Tauri library can otherwise leave incompatible codegen units that
# fail to link the development binary after test builds.
[profile.dev]
opt-level = 1
incremental = false

[profile.test]
opt-level = 1
