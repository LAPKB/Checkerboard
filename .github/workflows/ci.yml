name: Checkmate CI

on:
  push:
    branches: [launcher-checkmate-support]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA reachable from launcher-checkmate-support
        required: true
        type: string

permissions:
  contents: read

env:
  CHECKMATE_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
  CHECKMATE_REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
  CARGO_BUILD_JOBS: "2"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  GIT_TERMINAL_PROMPT: "0"
  # Existing public staging trust; no issuer or archive-signing secret is embedded.
  LAPKB_LOCAL_SIGNING_KID: local-staging-1
  LAPKB_LOCAL_SIGNING_PUBLIC_KEY_B64: 0KsmsPwJpk64Iq2RTjYS65RsH_WfE0aMP8K6F7p4FeM

jobs:
  macos:
    permissions:
      contents: read
      actions: write
    name: macOS ARM64, then Intel build candidates
    if: >-
      github.repository == 'LAPKB/Checkerboard'
      && github.ref == 'refs/heads/launcher-checkmate-support'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on:
      group: desktop-macos
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKMATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested source
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/validate-source.sh "$CHECKMATE_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Create private Rust build directories
        id: rust_home
        run: |
          set -euo pipefail
          root="$(mktemp -d "$RUNNER_TEMP/checkmate-rust.XXXXXXXXXX")"
          root="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$root")"
          chmod 700 "$root"
          mkdir -m 700 "$root/cargo" "$root/rustup" "$root/target" \
            "$root/r-library" "$root/r-downloads"
          identity="$(python3 -c 'import os,sys; s=os.lstat(sys.argv[1]); print(f"{s.st_dev}:{s.st_ino}")' "$root")"
          printf 'CARGO_HOME=%s/cargo\nRUSTUP_HOME=%s/rustup\nCARGO_TARGET_DIR=%s/target\nR_LIBS_USER=%s/r-library\n' "$root" "$root" "$root" "$root" >> "$GITHUB_ENV"
          printf 'directory=%s\nidentity=%s\n' "$root" "$identity" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin
      - name: Build frontend
        working-directory: desktop
        run: npm ci && npm test && npm exec -- tsc && npm exec -- vite build
      - name: Validate public verifier inputs
        run: node scripts/ci/validate-pilot-inputs.mjs
      - name: Fetch pinned private dependencies with scoped read-only identities
        env:
          LAPKB_SDK_READ_KEY: ${{ secrets.LAPKB_SDK_READ_KEY }}
          LAPKB_PROTOCOL_READ_KEY: ${{ secrets.LAPKB_PROTOCOL_READ_KEY }}
        run: bash scripts/ci/with-private-ssh-agent.sh cargo fetch --locked --manifest-path desktop/src-tauri/Cargo.toml
      - name: Install the pinned development-only R parity oracle
        timeout-minutes: 30
        env:
          R_JOB_DIRECTORY: ${{ steps.rust_home.outputs.directory }}
          R_JOB_IDENTITY: ${{ steps.rust_home.outputs.identity }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/ci/owned-temp-dir.py validate \
            "$RUNNER_TEMP" "$R_JOB_DIRECTORY" checkmate-rust "$R_JOB_IDENTITY"
          export TMPDIR="$R_JOB_DIRECTORY/r-downloads"
          archive="$TMPDIR/synergyfinder_3.20.0.tar.gz"
          mirror=https://bioconductor.statistik.tu-dortmund.de
          package=packages/3.23/bioc/src/contrib/synergyfinder_3.20.0.tar.gz
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --max-filesize 33554432 \
            --retry 3 --output "$archive" "$mirror/$package"
          printf '%s  %s\n' \
            a23f757272bffeee7d729e1f6d3bfba062e8ecd25a7597dc34421a7409fdb1f1 \
            "$archive" | shasum -a 256 --check
          Rscript --vanilla - "$R_LIBS_USER" "$archive" <<'RS'
          args <- commandArgs(trailingOnly = TRUE)
          library <- normalizePath(args[[1]], mustWork = TRUE)
          .libPaths(c(library, .Library), include.site = FALSE)
          options(repos = c(CRAN = "https://cloud.r-project.org"),
                  timeout = 180)
          # Use native binaries, not system/compiler installs. All writes stay
          # in this job's library. The shipped app has no R dependency.
          dependencies <- c(
            "drc", "reshape2", "tidyverse", "dplyr", "tidyr", "purrr", "furrr",
            "ggplot2", "ggforce", "vegan", "gstat", "sp", "SpatialExtremes",
            "ggrepel", "kriging", "plotly", "stringr", "future", "mice",
            "nleqslv", "magrittr", "pbapply", "metR", "jsonlite"
          )
          install.packages(dependencies, lib = library, type = "binary",
                           Ncpus = 2L,
                           dependencies = c("Depends", "Imports", "LinkingTo"))
          install.packages(args[[2]], repos = NULL, type = "source",
                           lib = library, Ncpus = 2L)
          stopifnot(requireNamespace("synergyfinder", quietly = TRUE),
                    requireNamespace("jsonlite", quietly = TRUE),
                    identical(as.character(packageVersion("synergyfinder")),
                              "3.20.0"))
          RS
      - name: Test native licensing and scientific core offline
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_SSH_COMMAND: /usr/bin/false
        run: cargo test --workspace --locked --offline --features local-staging --target aarch64-apple-darwin --manifest-path desktop/src-tauri/Cargo.toml
      - name: Build ARM64 app and DMG
        run: bash scripts/ci/build-macos-candidate.sh aarch64-apple-darwin
      - name: Prune superseded candidate artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/prune-superseded-artifacts.py

      - name: Retain ARM64 artifacts before Intel build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkmate-macos-arm64-build-candidate
          path: |
            ${{ env.CARGO_TARGET_DIR }}/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.CARGO_TARGET_DIR }}/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Install Intel Rust target
        run: rustup target add --toolchain 1.97.1 x86_64-apple-darwin
      - name: Build Intel app and DMG
        run: bash scripts/ci/build-macos-candidate.sh x86_64-apple-darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkmate-macos-x64-build-candidate
          path: |
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.CARGO_TARGET_DIR }}/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's Rust directories
        if: always()
        env:
          RUST_HOME_DIR: ${{ steps.rust_home.outputs.directory }}
          RUST_HOME_IDENTITY: ${{ steps.rust_home.outputs.identity }}
        run: python3 scripts/ci/owned-temp-dir.py cleanup "$RUNNER_TEMP" "$RUST_HOME_DIR" checkmate-rust "$RUST_HOME_IDENTITY"

  containers:
    permissions:
      contents: read
      actions: write
    name: ${{ matrix.target }} build candidate
    if: >-
      github.repository == 'LAPKB/Checkerboard'
      && github.ref == 'refs/heads/launcher-checkmate-support'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, "${{ matrix.runner_arch }}"]
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner_arch: X64
          - target: aarch64-unknown-linux-gnu
            runner_arch: ARM64
          - target: x86_64-pc-windows-msvc
            runner_arch: X64
          - target: aarch64-pc-windows-msvc
            runner_arch: X64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKMATE_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify requested source
        if: github.event_name == 'workflow_dispatch'
        run: bash scripts/ci/validate-source.sh "$CHECKMATE_SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Build and verify packages with credentials confined to fetch
        id: build
        env:
          LAPKB_SDK_READ_KEY: ${{ secrets.LAPKB_SDK_READ_KEY }}
          LAPKB_PROTOCOL_READ_KEY: ${{ secrets.LAPKB_PROTOCOL_READ_KEY }}
        run: bash scripts/ci/with-private-ssh-agent.sh bash scripts/ci/build-container-candidate.sh "${{ matrix.target }}"
      - name: Prune superseded candidate artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/prune-superseded-artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkmate-${{ matrix.target }}-build-candidate
          path: ${{ steps.build.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove this job's artifact directory
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.build.outputs.artifact_dir }}
          ARTIFACT_IDENTITY: ${{ steps.build.outputs.artifact_identity }}
        run: python3 scripts/ci/owned-temp-dir.py cleanup "$RUNNER_TEMP" "$ARTIFACT_DIR" checkmate-artifacts "$ARTIFACT_IDENTITY"
